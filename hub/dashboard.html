<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub dispositivi</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111a20; color: #eef4f6; }
  main { max-width: 65rem; margin: auto; padding: 2rem 1rem; }
  h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.3rem); }
  #devices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: 1rem; }
  article { background: #1b2930; border: 1px solid #3c5159; border-radius: .7rem; padding: 1rem; overflow-wrap: anywhere; }
  .map-link { display: inline-block; margin-top: .75rem; padding: .5rem 1rem; background: #245782; color: white; border-radius: .5rem; text-decoration: none; font-weight: 700; }
  h2 { margin: 0; font-size: 1.3rem; }
  p { color: #c3d4dc; }
  .online { color: #8ff1bd; }
  .offline, #status[data-error] { color: #ffcd9b; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem .8rem; margin-bottom: 0; }
  dd { margin: 0; }
</style>
<main>
  <h1>Hub dispositivi</h1>
  <a class="map-link" href="/index.html">Mappa</a>
  <p id="status" role="status">Caricamento…</p>
  <section id="devices" aria-label="Dispositivi"></section>
  <noscript>Attiva JavaScript per aggiornare lo stato dei dispositivi.</noscript>
</main>
<script>
const status = document.querySelector('#status');
const devices = document.querySelector('#devices');
const opening = new Set();
const time = value => value ? new Date(value).toLocaleString('it-IT') : '—';

function element(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}

function renderHub(hub) {
  const card = document.createElement('article');
  const state = element('p', hub.online ? 'Hub · Online' : 'Hub · Offline');
  state.className = hub.online ? 'online' : 'offline';
  card.append(element('h2', hub.name), state);
  return card;
}

async function openRover(deviceId, url, button) {
  if (opening.has(deviceId)) return;
  opening.add(deviceId);
  button.disabled = true;
  button.textContent = 'Attendo il Rover…';
  const tab = window.open('about:blank', '_blank');
  if (tab) tab.opener = null;
  try {
    const response = await fetch(`/api/v1/devices/${encodeURIComponent(deviceId)}/open`, {
      method: 'POST',
      headers: { 'X-Hub-Action': 'open-rover' },
      signal: AbortSignal.timeout(35000),
    });
    const result = await response.json();
    if (response.ok && result.status === 'ready') {
      (tab && !tab.closed ? tab : window).location.href = url.href;
      return;
    }
    const errors = {
      rover_unreachable: 'Rover non raggiungibile. Controlla che sia acceso, connesso a Internet e online su Tailscale.',
      socket_unavailable: 'La porta del Rover è chiusa. Controlla che il servizio di avvio su richiesta sia installato e abilitato.',
      rover_start_failed: 'Il Rover ha accettato la connessione, ma il servizio non ha risposto in tempo.',
      page_unavailable: 'Il server del Rover ha risposto, ma la pagina non è disponibile.',
    };
    throw new Error(errors[result.error] ?? 'Impossibile aprire la pagina del Rover.');
  } catch (error) {
    if (tab) tab.close();
    window.alert(error.message);
  } finally {
    opening.delete(deviceId);
    // La scheda può essere stata sostituita dall'aggiornamento periodico.
    const currentButton = devices.querySelector(`button[data-rover="${CSS.escape(deviceId)}"]`);
    if (currentButton) {
      currentButton.disabled = false;
      currentButton.textContent = 'Apri la pagina del Rover';
    }
  }
}

function render(device) {
  const card = document.createElement('article');
  const title = element('h2', device.device_id);
  const simulated = device.event?.payload?.simulated === true || device.device_id.startsWith('demo-');
  const type = { rover: 'Rover', base: 'Base RTK' }[device.device_type] ?? device.device_type;
  const summary = element('p', `${type}${simulated ? ' · Simulato' : ''} · ${device.online ? 'Online' : device.received_at ? 'Offline' : 'In attesa di dati'}`);
  summary.className = device.online ? 'online' : 'offline';
  const details = document.createElement('dl');
  const sample = device.status_event;
  const payload = sample?.payload;
  const base = payload?.base;
  const gnss = payload?.gnss;
  const rtcm = payload?.rtcm;
  const rows = [
    ['Ricezione', time(device.received_at)],
    ['Età alla lettura', device.age_seconds == null ? '—' : `${device.age_seconds} s`],
    ['Ora misura', time(sample?.observed_at)],
    ['Evento', device.event?.event_type ?? '—'],
    ['GNSS', typeof gnss?.rtk_status === 'string' ? gnss.rtk_status : '—'],
    ['RTCM', typeof rtcm?.connected === 'boolean' ? (rtcm.connected ? 'Connesso' : 'Disconnesso') : '—'],
  ];
  if (device.device_type === 'rover' && gnss) {
    const hasPosition = Number.isFinite(gnss.lat) && Math.abs(gnss.lat) <= 90
                     && Number.isFinite(gnss.lon) && Math.abs(gnss.lon) <= 180;
    rows.push(
      ['Posizione Rover', hasPosition ? `${gnss.lat}, ${gnss.lon}` : '—'],
      ['Ora posizione GNSS', Number.isFinite(gnss.fix_timestamp) ? time(gnss.fix_timestamp * 1000) : '—'],
      ['Età RTCM alla misura', Number.isFinite(rtcm?.age_seconds) ? `${rtcm.age_seconds.toFixed(1)} s` : '—'],
    );
  }
  if (base) {
    const pos = base.position;
    rows.push(
      ['Posizione Base', pos ? `${pos.lat}, ${pos.lon}` : '—'],
      ['Origine', base.source ?? '—'],
      ['Qualità GGA', base.quality ?? 'Non riportata'],
    );
  }
  for (const [label, value] of rows) {
    details.append(element('dt', label), element('dd', value));
  }
  card.append(title, summary, details);
  if (device.device_type === 'rover' && typeof device.dashboard_url === 'string') {
    try {
      const url = new URL(device.dashboard_url);
      if (['http:', 'https:'].includes(url.protocol) && !url.username && !url.password
          && url.pathname === '/autopilota.html' && !url.search && !url.hash) {
        const pending = opening.has(device.device_id);
        const button = element('button', pending ? 'Attendo il Rover…' : 'Apri la pagina del Rover');
        button.type = 'button';
        button.dataset.rover = device.device_id;
        button.disabled = pending;
        button.addEventListener('click', () => openRover(device.device_id, url, button));
        const actions = document.createElement('p');
        actions.append(button);
        card.append(actions);
      }
    } catch {
      // Una configurazione locale non valida non impedisce di leggere lo stato.
    }
  }
  return card;
}

async function refresh() {
  try {
    const response = await fetch('/api/v1/devices', { signal: AbortSignal.timeout(8000) });
    if (!response.ok) throw new Error('Hub non raggiungibile');
    const report = await response.json();
    const cards = report.devices.map(render);
    if (report.hub) cards.unshift(renderHub(report.hub));
    devices.replaceChildren(...cards);
    delete status.dataset.error;
    status.textContent = `Ultimo aggiornamento ${time(Date.now())} · soglia offline ${report.stale_after_seconds} s`;
  } catch {
    devices.replaceChildren();
    status.dataset.error = '';
    status.textContent = 'Impossibile leggere lo stato dei dispositivi. Nuovo tentativo tra 5 secondi.';
  } finally {
    setTimeout(refresh, 5000);
  }
}
refresh();
</script>
</html>
